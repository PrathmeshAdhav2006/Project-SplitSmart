spring.application.name=splitsmart-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/splitsmart?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:splitsmart_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
